management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 8082
  forward-headers-strategy: framework

spring:
  datasource:
    url: jdbc:postgresql://core-db:5432/fdmatch_core
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  kafka:
    bootstrap-servers: kafka:9092
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

clients:
  users-service:
    url: http://users:8081

service:
  api-key: ${SERVICE_API_KEY}

media:
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    upload-ttl-minutes: 5
    download-ttl-minutes: 60

notifications:
  firebase:
    credentials-json: ${FIREBASE_CREDENTIALS_JSON}
    project-id: ${FIREBASE_PROJECT_ID}