server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fdmatch_core
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092

clients:
  users-service:
    url: http://localhost:8081

service:
  api-key:
    some-api-key