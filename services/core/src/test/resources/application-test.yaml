spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/fdmatch_core_test
    username: testuser
    password: testpassword
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: false

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

clients:
  users-service:
    url: http://localhost:8080

media:
  s3:
    bucket: test-bucket
    region: us-east-1
    access-key: test-access-key
    secret-key: test-secret-key

notifications:
  firebase:
    credentials-json: '{}'
    project-id: test-project

logging:
  level:
    root: DEBUG

service:
  api-key: some-api-key
