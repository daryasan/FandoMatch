management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

server:
  port: 8080

routes:
  url:
    users: http://users:8081
    core: http://core:8082
    messaging: http://messaging:8083