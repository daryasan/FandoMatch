management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    export:
      prometheus:
        enabled: true

server:
  port: 8081
  forward-headers-strategy: framework

spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  privateKey: ${JWT_PRIVATE_KEY}
  publicKey: ${JWT_PUBLIC_KEY}
  accessExpiration: ${ACCESS_EXPIRATION}
  refreshExpirationDays: ${REFRESH_EXPIRATION_DAYS}

clients:
  core-service:
    url: http://core:8082

service:
  api-key: ${SERVICE_API_KEY}

notifications:
  firebase:
    credentials-json: ${FIREBASE_CREDENTIALS_JSON}
    project-id: ${FIREBASE_PROJECT_ID}
