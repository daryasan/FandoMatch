management:
  endpoints:
    web:
      exposure:
        include: health

spring:
  mail:
    host: smtp.mail.ru
    port: 465
    username: fandomatch@mail.ru
    password: ${EMAIL_SENDER_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

  jpa:
    open-in-view: false
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: core-service-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: userChangedEvent:com.fandomatch.core.model.UserChangedEvent
    admin:
      auto-create: true

notifications:
  email:
    from: fandomatch@mail.ru

logging:
  level:
    org.apache.kafka: INFO
    org.apache.kafka.clients: INFO
    org.apache.kafka.clients.NetworkClient: INFO
    org.apache.kafka.clients.FetchSessionHandler: INFO
    org.springframework.kafka: INFO
    org.apache.coyote.http11.Http11Processor: WARN