server:
  port: 8081

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/fdmatch_users
    username: postgres
    password: 1234
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        show_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

clients:
  core-service:
    url: http://localhost:8082

service:
  api-key:
    some-api-key

logging:
  level:
    org.apache.kafka: INFO
    org.apache.kafka.clients: INFO
    org.apache.kafka.clients.NetworkClient: INFO
    org.apache.kafka.clients.FetchSessionHandler: INFO
    org.springframework.kafka: INFO
    root: DEBUG

jwt:
  privateKey: 
  publicKey: 
  accessExpiration: 900000
  refreshExpirationDays: 60