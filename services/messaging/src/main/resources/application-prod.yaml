management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/fdmatch_messaging
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

service:
  api-key: ${SERVICE_API_KEY}

clients:
  users-service:
    url: ${USERS_SERVICE_URL}
  core-service:
    url: ${CORE_SERVICE_URL}

media:
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    upload-ttl-minutes: 5
    download-ttl-minutes: 60

