management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always

server:
  port: 8083

spring:
  datasource:
    url: jdbc:postgresql://messaging-db:5432/fdmatch_messaging
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: kafka:9092

service:
  api-key: ${SERVICE_API_KEY}

clients:
  users-service:
    url: http://users:8081
  core-service:
    url: http://core:8082

media:
  s3:
    bucket: ${S3_BUCKET}
    region: ${S3_REGION}
    access-key: ${S3_ACCESS_KEY}
    secret-key: ${S3_SECRET_KEY}
    upload-ttl-minutes: 5
    download-ttl-minutes: 60

notifications:
  firebase:
    credentials-json: ${FIREBASE_CREDENTIALS_JSON}
    project-id: ${FIREBASE_PROJECT_ID}
