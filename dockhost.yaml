version: 1
project: fdmatch

environment:
  variables:
    JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY}
    JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
    SERVICE_API_KEY: ${SERVICE_API_KEY}
    ACCESS_EXPIRATION: ${ACCESS_EXPIRATION}
    REFRESH_EXPIRATION_DAYS: ${REFRESH_EXPIRATION_DAYS}
    S3_BUCKET: ${S3_BUCKET}
    S3_REGION: ${S3_REGION}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY}
    S3_SECRET_KEY: ${S3_SECRET_KEY}
    FIREBASE_CREDENTIALS_JSON: ${FIREBASE_CREDENTIALS_JSON}
    FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID}
    GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
    GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}

volumes:
  users-db-data:
    type: ssd
    size: 2Gib
  core-db-data:
    type: ssd
    size: 2Gib
  messaging-db-data:
    type: ssd
    size: 2Gib
  prometheus-data:
    type: ssd
    size: 5Gib
  grafana-data:
    type: ssd
    size: 2Gib

containers:
  users-db:
    image: postgres:15
    variables:
      POSTGRES_DB: fdmatch_users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432
    volumes:
      - name: users-db-data
        mountPath: /var/lib/postgresql/data

  core-db:
    image: postgres:15
    variables:
      POSTGRES_DB: fdmatch_core
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432
    volumes:
      - name: core-db-data
        mountPath: /var/lib/postgresql/data

  messaging-db:
    image: postgres:15
    variables:
      POSTGRES_DB: fdmatch_messaging
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - 5432
    volumes:
      - name: messaging-db-data
        mountPath: /var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    resources:         
        memory: 2GiB  
        cpu: 2  
    variables:
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_NODE_ID: "1"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    ports:
      - 9092

  gateway:
    image: daryasssan/fandomatch:fdmatch-gateway
    variables:
      SPRING_PROFILES_ACTIVE: prod
      USERS_SERVICE_URL: http://users:8081
      CORE_SERVICE_URL: http://core:8082
      MESSAGING_SERVICE_URL: http://messaging:8083
    ports:
      - 8080

  users:
    image:  daryasssan/fandomatch:fdmatch-users
    variables:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://users-db:5432/fdmatch_users
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_PRIVATE_KEY: $JWT_PRIVATE_KEY
      JWT_PUBLIC_KEY: $JWT_PUBLIC_KEY
      SERVICE_API_KEY: $SERVICE_API_KEY
      ACCESS_EXPIRATION: $ACCESS_EXPIRATION
      REFRESH_EXPIRATION_DAYS: $REFRESH_EXPIRATION_DAYS
      FIREBASE_CREDENTIALS_JSON: $FIREBASE_CREDENTIALS_JSON
      FIREBASE_PROJECT_ID: $FIREBASE_PROJECT_ID
    ports:
      - 8081

  core:
    image: daryasssan/fandomatch:fdmatch-core
    variables:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://core-db:5432/fdmatch_core
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_PRIVATE_KEY: $JWT_PRIVATE_KEY
      JWT_PUBLIC_KEY: $JWT_PUBLIC_KEY
      SERVICE_API_KEY: $SERVICE_API_KEY
      S3_BUCKET: $S3_BUCKET
      S3_REGION: $S3_REGION
      S3_ACCESS_KEY: $S3_ACCESS_KEY
      S3_SECRET_KEY: $S3_SECRET_KEY
      FIREBASE_CREDENTIALS_JSON: $FIREBASE_CREDENTIALS_JSON
      FIREBASE_PROJECT_ID: $FIREBASE_PROJECT_ID
      CLIENTS_USERS_SERVICE_URL: http://users:8081
    ports:
      - 8082

  prometheus:
    image: daryasssan/fandomatch:prometheus-prod
    ports:
      - 9090
    volumes:
      - name: prometheus-data
        mountPath: /prometheus

  grafana:
    image: grafana/grafana:latest
    variables:
      GF_SECURITY_ADMIN_USER: $GF_SECURITY_ADMIN_USER
      GF_SECURITY_ADMIN_PASSWORD: $GF_SECURITY_ADMIN_PASSWORD
      GF_INSTALL_PLUGINS: grafana-piechart-panel
      GF_SERVER_ROOT_URL: https://qxi0-vbn5-za9i.gw-1a.dockhost.net/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    ports:
      - 3000
    volumes:
      - name: grafana-data
        mountPath: /var/lib/grafana

  messaging:
    image: daryasssan/fandomatch:fdmatch-messaging
    replicas: 1
    variables:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_DATASOURCE_URL: jdbc:postgresql://messaging-db:5432/fdmatch_messaging
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVICE_API_KEY: $SERVICE_API_KEY
      CLIENTS_USERS_SERVICE_URL: http://users:8081
      CLIENTS_CORE_SERVICE_URL: http://core:8082
      S3_BUCKET: $S3_BUCKET
      S3_REGION: $S3_REGION
      S3_ACCESS_KEY: $S3_ACCESS_KEY
      S3_SECRET_KEY: $S3_SECRET_KEY
      FIREBASE_CREDENTIALS_JSON: $FIREBASE_CREDENTIALS_JSON
      FIREBASE_PROJECT_ID: $FIREBASE_PROJECT_ID
    ports:
      - 8083
      
network:
  domains:
    qxi0-vbn5-za9i.gw-1a.dockhost.net:
  ports:
    gateway-port:
      service: gateway
      port: 8080
    grafana-port:
      service: grafana
      port: 3000
    prometheus-port:
      service: prometheus
      port: 9090
  routes:
    main-api:
      domain: qxi0-vbn5-za9i.gw-1a.dockhost.net
      path: /
      service: gateway
      port: 8080
    grafana:
      domain: qxi0-vbn5-za9i.gw-1a.dockhost.net
      path: /grafana
      service: grafana
      port: 3000
    prometheus:
      domain: qxi0-vbn5-za9i.gw-1a.dockhost.net
      path: /prometheus-ui
      service: prometheus
      port: 9090
