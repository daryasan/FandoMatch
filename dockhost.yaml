version: 1
project: fandomatch

environment:
  GLOBAL_VAR: value

containers:
  users-db:
    image: postgres:15
    volumes:
      - name: users-db-data
        mountPath: /var/lib/postgresql/data

  core-db:
    image: postgres:15
    volumes:
      - name: core-db-data
        mountPath: /var/lib/postgresql/data

  messaging-db:
    image: postgres:15
    volumes:
      - name: messaging-db-data
        mountPath: /var/lib/postgresql/data

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    ports: '9092'

  gateway:
    image: daryasan/fdmatch-gateway:latest
    ports: '8080'

  users:
    image: daryasan/fdmatch-users:latest

  core:
    image: daryasan/fdmatch-core:latest

  messaging:
    image: daryasan/fdmatch-messaging:latest

volumes:
  users-db-data:
    type: ssd
    size: 2Gib
  core-db-data:
    type: ssd
    size: 2Gib
  messaging-db-data:
    type: ssd
    size: 2Gib
