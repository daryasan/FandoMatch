name: Microservice CI

on:
  pull_request:
    branches:
      - master
    types: [opened, synchronize, reopened, closed]

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed' || github.event.pull_request.merged == false

    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fdmatch_users_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d fdmatch_users_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fdmatch_users_test
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpassword
      SPRING_PROFILES_ACTIVE: ci
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Generate OpenAPI models
        run: ./gradlew openApiGenerate

      - name: Run tests
        run: ./gradlew :services:users:test

  build-and-push:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push images
        run: |
          SERVICES=(
            "gateway:services/gateway/Dockerfile"
            "users:services/users/Dockerfile"
            "matches:services/core/Dockerfile"
            "notifications:services/messaging/Dockerfile"
          )
          for entry in "${SERVICES[@]}"; do
            service="${entry%%:*}"
            dockerfile="${entry#*:}"
            image="daryasssan/fandomatch:fdmatch-${service}"
            echo "Building $image from $dockerfile"
            docker build --platform linux/amd64 -f "$dockerfile" -t "$image" .
            docker push "$image"
          done