name: Microservice Test Coverage

on:
  pull_request:
    branches:
      - master

jobs:
  test-users:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: fdmatch_users_test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d fdmatch_users_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/fdmatch_users_test
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpassword
      SPRING_PROFILES_ACTIVE: ci
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Docker
        uses: docker/setup-buildx-action@v3

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Generate OpenAPI models
        run: ./gradlew openApiGenerate

      - name: Run tests with coverage
        run: ./gradlew :services:users:test :services:users:jacocoTestReport

      - name: Generate coverage report summary
        id: jacoco
        uses: madrapps/jacoco-report@v1.6
        with:
          paths: services/users/build/reports/jacoco/test/jacocoTestReport.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 0
          min-coverage-changed-files: 0

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: services/users/build/reports/jacoco/test/html


      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          token: ${{ secrets.GITHUB_TOKEN }}
          header: coverage-report
          message: |
            ## Test Coverage Report

            **Total Coverage:** ${{ steps.jacoco.outputs.coverage-overall }}%

            **Changed Files Coverage:** ${{ steps.jacoco.outputs.coverage-changed-files }}%

            _Generated automatically by CI_

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/jacocoRootReport/html

