openapi: 3.0.3
info:
  title: core service api
  version: 1.3.0
  description: API для core‑модуля

components:

  # -------------------------
  # SECURITY
  # -------------------------

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TokenHeader:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Bearer JWT token


  # -------------------------
  # SCHEMAS
  # -------------------------

  schemas:

    # -------------------------
    # COMMON
    # -------------------------

    ResponseStatus:
      type: string
      enum:
        - SUCCESS
        - ERROR
      description: Статус выполнения запроса

    Error:
      type: object
      properties:
        error_code:
          type: string
          description: Код ошибки (например, BUSINESS_ERROR, VALIDATION_ERROR)
        error_message:
          type: string
          description: Описание ошибки
      required:
        - error_code

    EmptySuccess:
      type: object
      properties: {}
      description: Пустой объект для успешных ответов без данных

    # -------------------------
    # USER PROFILE
    # -------------------------

    UserProfileRequest:
      type: object
      properties:
        username:
          type: string
      required:
        - username

    UserProfileResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/BaseUserProfile'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    BaseUserProfile:
      type: object
      discriminator:
        propertyName: profile_type
        mapping:
          OWN: '#/components/schemas/FullUserProfileResponse'
          FRIEND: '#/components/schemas/FriendUserProfileResponse'
          OTHER: '#/components/schemas/PublicUserProfileResponse'
      properties:
        profile_type:
          $ref: '#/components/schemas/ProfileType'
      required:
        - profile_type

    ProfileType:
      type: string
      enum:
        - OWN
        - FRIEND
        - OTHER
      description: Тип профиля относительно текущего пользователя

    FullUserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/BaseUserProfile'
        - type: object
          properties:
            username:
              type: string
            email:
              type: string
            phone:
              type: string
            status:
              type: string
            created_at:
              type: string
              format: date-time
            bio:
              type: string
            avatar_url:
              type: string
            background_url:
              type: string
            name:
              type: string
            gender:
              type: string
            birth_date:
              type: string
              format: date
            city:
              type: string
            fandoms:
              type: array
              items:
                $ref: '#/components/schemas/Fandom'
          required:
            - username
            - status
            - created_at
            - name
            - birth_date

    PublicUserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/BaseUserProfile'
        - type: object
          properties:
            username:
              type: string
            name:
              type: string
            bio:
              type: string
            avatar_url:
              type: string
            background_url:
              type: string
            city:
              type: string
            fandoms:
              type: array
              items:
                $ref: '#/components/schemas/Fandom'
          required:
            - username
            - name

    FriendUserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/BaseUserProfile'
        - type: object
          properties:
            name:
              type: string
            bio:
              type: string
            avatar_url:
              type: string
            background_url:
              type: string
            city:
              type: string
            fandoms:
              type: array
              items:
                $ref: '#/components/schemas/Fandom'
          required:
            - name

    EditUserProfileRequest:
      type: object
      properties:
        bio:
          type: string
        avatar_url:
          type: string
        background_url:
          type: string
        name:
          type: string
        gender:
          type: string
        birth_date:
          type: string
          format: date
        city:
          type: string

    EditUserProfileResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/FullUserProfileResponse'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status


    # -------------------------
    # MATCHING
    # -------------------------

    MatchBatchRequest:
      type: object
      properties:
        batch_size:
          type: integer
      required:
        - batch_size

    MatchCandidateBatchData:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidateResponse'
      required:
        - candidates

    MatchCandidateBatchResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/MatchCandidateBatchData'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    MatchCandidateResponse:
      type: object
      properties:
        username:
          type: string
        name:
          type: string
        age:
          type: integer
        city:
          type: string
        avatar_url:
          type: string
        fandoms:
          type: array
          items:
            type: string
        compatibility:
          type: integer
      required:
        - username

    MatchActionRequest:
      type: object
      properties:
        target_username:
          type: string
        action:
          type: string
          enum:
            - LIKE
            - DISLIKE
      required:
        - target_username
        - action

    MatchActionResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - LIKED
            - DISLIKED
            - MATCH
        match_chat_id:
          type: string
          nullable: true
      required:
        - status

    MatchActionResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/MatchActionResult'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    MatchFilterRequest:
      type: object
      properties:
        gender:
          type: string
        age_from:
          type: integer
        age_to:
          type: integer
        city:
          type: string
        fandom_category:
          type: string
        fandom_id:
          type: string

    MatchFilterSuccess:
      type: object
      properties: {}

    MatchFilterResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/MatchFilterSuccess'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status


    # -------------------------
    # POSTS
    # -------------------------

    PostsGetRequest:
      type: object
      properties:
        username:
          type: string
        page:
          type: integer
        size:
          type: integer
      required:
        - username

    CreatePostRequest:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        fandom_id:
          type: string
      required:
        - title
        - content

    Post:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        created_at:
          type: string
          format: date-time
      required:
        - id
        - title
        - content
        - created_at

    CreatePostResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/Post'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    PostListData:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/Post'
      required:
        - posts

    PostListResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/PostListData'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    CommentListData:
      type: object
      properties:
        comments:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              author:
                type: string
              content:
                type: string
              created_at:
                type: string
                format: date-time
      required:
        - comments

    CommentListResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/CommentListData'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    PostLikeSuccess:
      type: object
      properties:
        status:
          type: string
          enum: [LIKED]

    PostLikeResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/PostLikeSuccess'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status


    # -------------------------
    # FANDOMS
    # -------------------------

    FandomsGetRequest:
      type: object
      properties:
        username:
          type: string
      required:
        - username

    FandomListData:
      type: object
      properties:
        fandoms:
          type: array
          items:
            $ref: '#/components/schemas/Fandom'
      required:
        - fandoms

    FandomListResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/FandomListData'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    Fandom:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        description:
          type: string
      required:
        - id
        - name

    FandomCategoryListData:
      type: object
      properties:
        categories:
          type: array
          items:
            type: string
      required:
        - categories

    FandomCategoryListResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/FandomCategoryListData'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    FandomRequestCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          type: string
        author_username:
          type: string
      required:
        - name
        - author_username

    FandomRequestCreateSuccess:
      type: object
      properties:
        status:
          type: string
          enum: [RECEIVED]

    FandomRequestCreateResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/FandomRequestCreateSuccess'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status