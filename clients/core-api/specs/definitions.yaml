openapi: 3.0.3
info:
  title: core service api
  version: 1.3.0
  description: API для core‑модуля

components:

  # -------------------------
  # SECURITY
  # -------------------------

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    TokenHeader:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
      description: Bearer JWT token

    ServiceApiKeyHeader:
      name: X-Api-Key
      in: header
      required: true
      schema:
        type: string
      description: Сервисный ключ (SERVICE_API_KEY)
  # -------------------------
  # SCHEMAS
  # -------------------------

  schemas:

    # -------------------------
    # MEDIA
    # -------------------------

    MediaType:
      type: string
      enum:
        - IMAGE
        - VIDEO

    MediaItem:
      type: object
      properties:
        media_id:
          type: string
        media_type:
          $ref: '#/components/schemas/MediaType'
        url:
          type: string
      required:
        - media_id
        - media_type
        - url

    # -------------------------
    # COMMON
    # -------------------------

    ResponseStatus:
      type: string
      enum:
        - SUCCESS
        - ERROR
      description: Статус выполнения запроса

    Error:
      type: object
      properties:
        error_code:
          type: string
          description: Код ошибки (например, BUSINESS_ERROR, VALIDATION_ERROR)
        error_message:
          type: string
          description: Описание ошибки
      required:
        - error_code

    EmptySuccess:
      type: object
      properties: { }
      description: Пустой объект для успешных ответов без данных

    TimestampPaginationRequest:
      type: object
      properties:
        cursor_timestamp:
          type: integer
          format: int64
          description: time in epoch seconds as a cursor (last received item)
        size:
          type: integer
      required:
        - size

    # -------------------------
    # USER PROFILE
    # -------------------------

    UserProfileRequest:
      type: object
      properties:
        uuid:
          type: string
      required:
        - uuid

    UserProfileResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/BaseUserProfile'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    BaseUserProfile:
      type: object
      discriminator:
        propertyName: profile_type
        mapping:
          OWN: '#/components/schemas/FullUserProfileResponse'
          FRIEND: '#/components/schemas/FriendUserProfileResponse'
          OTHER: '#/components/schemas/PublicUserProfileResponse'
      properties:
        profile_type:
          $ref: '#/components/schemas/ProfileType'
      required:
        - profile_type

    ProfileType:
      type: string
      enum:
        - OWN
        - FRIEND
        - OTHER
      description: Тип профиля относительно текущего пользователя

    FullUserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/BaseUserProfile'
        - type: object
          properties:
            uid:
              type: string
            username:
              type: string
            email:
              type: string
            status:
              type: string
            created_at:
              type: long
              description: epoch seconds
            bio:
              type: string
            avatar:
              $ref: '#/components/schemas/MediaItem'
            background:
              $ref: '#/components/schemas/MediaItem'
            name:
              type: string
            gender:
              $ref: '#/components/schemas/Gender'
            birth_date:
              type: long
              description: birth date in epoch seconds
            age:
              type: long
              description: age in epoch seconds
            city:
              $ref: '#/components/schemas/City'
            fandoms:
              type: array
              items:
                $ref: '#/components/schemas/Fandom'
          required:
            - uid
            - username
            - name
            - birth_date
            - age
            - gender
            - status
            - created_at
            - fandoms

    PublicUserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/BaseUserProfile'
        - type: object
          properties:
            uid:
              type: string
            name:
              type: string
            bio:
              type: string
            avatar:
              $ref: '#/components/schemas/MediaItem'
            background:
              $ref: '#/components/schemas/MediaItem'
            city:
              $ref: '#/components/schemas/City'
            fandoms:
              type: array
              items:
                $ref: '#/components/schemas/Fandom'
            has_current_user_reacted:
              type: boolean
            age:
              type: long
              description: age in epoch seconds
            gender:
              $ref: '#/components/schemas/Gender'
          required:
            - uid
            - name
            - age
            - gender
            - has_current_user_reacted
            - fandoms

    FriendUserProfileResponse:
      allOf:
        - $ref: '#/components/schemas/BaseUserProfile'
        - type: object
          properties:
            uid:
              type: string
            username:
              type: string
            name:
              type: string
            bio:
              type: string
            avatar:
              $ref: '#/components/schemas/MediaItem'
            background:
              $ref: '#/components/schemas/MediaItem'
            city:
              $ref: '#/components/schemas/City'
            fandoms:
              type: array
              items:
                $ref: '#/components/schemas/Fandom'
            age:
              type: long
              description: age in epoch seconds
            gender:
              $ref: '#/components/schemas/Gender'
          required:
            - uid
            - username
            - name
            - age
            - gender

    EditUserProfileRequest:
      type: object
      properties:
        bio:
          type: string
        avatar_media_id:
          type: string
        background_media_id:
          type: string
        name:
          type: string
        city:
          $ref: '#/components/schemas/City'
        fandom_ids:
          type: array
          items:
            type: string
          description: "Список ID фандомов пользователя (заменяет текущие)"

    Gender:
      type: string
      enum:
        - MALE
        - FEMALE
        - OTHER

    City:
      type: object
      properties:
        name_en:
          type: string
        name_ru:
          type: string
      required:
        - name_en
        - name_ru

    EditUserProfileResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/FullUserProfileResponse'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status


    GetRelatedUsersRequest:
      type: object
      properties:
        uuid:
          type: string
      required:
        - uuid

    FriendsResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          type: object
          properties:
            friends:
              type: array
              items:
                $ref: '#/components/schemas/FriendUserProfileResponse'
          required:
            - friends
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status


    PendingRequestsResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          type: object
          properties:
            requests:
              type: array
              items:
                $ref: '#/components/schemas/PublicUserProfileResponse'
          required:
            - requests
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status


    # -------------------------
    # MATCHING
    # -------------------------

    MatchBatchRequest:
      type: object
      properties:
        batch_size:
          type: integer
      required:
        - batch_size

    MatchCandidateBatchData:
      type: object
      properties:
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidateResponse'
      required:
        - candidates

    MatchCandidateBatchResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/MatchCandidateBatchData'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    MatchCandidateResponse:
      type: object
      properties:
        uuid:
          type: string
        username:
          type: string
        name:
          type: string
        age:
          type: integer
        gender:
          $ref: '#/components/schemas/Gender'
        city:
          $ref: '#/components/schemas/City'
        avatar:
          $ref: '#/components/schemas/MediaItem'
        fandoms:
          type: array
          items:
            $ref: '#/components/schemas/Fandom'
        compatibility:
          type: integer
      required:
        - uuid
        - name
        - age
        - gender
        - compatibility
        - fandoms
        - username

    MatchActionRequest:
      type: object
      properties:
        target_uuid:
          type: string
        action:
          type: string
          enum:
            - LIKE
            - DISLIKE
      required:
        - target_uuid
        - action

    MatchActionResult:
      type: object
      properties:
        status:
          type: string
          enum:
            - LIKED
            - DISLIKED
            - MATCH
      required:
        - status

    MatchActionResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/MatchActionResult'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    MatchFilterRequest:
      type: object
      properties:
        filters:
          $ref: '#/components/schemas/MatchFilter'
      required:
        - filters

    MatchFilter:
      type: object
      properties:
        gender:
          type: array
          items:
            $ref: '#/components/schemas/Gender'
        age_from:
          type: integer
        age_to:
          type: integer
        only_in_user_city:
          type: boolean
        fandom_category:
          type: array
          items:
            $ref: '#/components/schemas/FandomCategory'
        fandom_id:
          type: array
          items:
            $ref: '#/components/schemas/Fandom'

    MatchFilterResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    CurrentFiltersResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/MatchFilter'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status


    # -------------------------
    # POSTS
    # -------------------------

    PostsGetRequest:
      type: object
      properties:
        uuid:
          type: string
        pagination:
          $ref: '#/components/schemas/TimestampPaginationRequest'
      required:
        - uuid

    PostMediaInput:
      type: object
      description: Медиа-вложение при создании поста (media_id из /media/presigned-upload + тип)
      properties:
        media_id:
          type: string
        media_type:
          $ref: '#/components/schemas/MediaType'
      required:
        - media_id
        - media_type

    CreatePostRequest:
      type: object
      properties:
        content:
          type: string
        fandom_ids:
          type: array
          items:
            type: string
          description: "Список ID фандомов поста"
        media_items:
          type: array
          items:
            $ref: '#/components/schemas/PostMediaInput'
      required:
        - content

    Post:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        like_count:
          type: integer
        comment_count:
          type: integer
        is_liked_by_current_user:
          type: boolean
        author:
          type: object
          properties:
            username:
              type: string
            uuid:
              type: string
            name:
              type: string
            avatar:
              $ref: '#/components/schemas/MediaItem'
          required:
            - uuid
            - username
            - name
        fandoms:
          type: array
          items:
            $ref: '#/components/schemas/Fandom'
        created_at:
          type: long
          description: epoch seconds
        media_items:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
      required:
        - id
        - content
        - created_at
        - author
        - like_count
        - comment_count
        - is_liked_by_current_user

    ExtendedPostResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/ExtendedPost'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    ExtendedPost:
      type: object
      properties:
        id:
          type: string
        content:
          type: string
        like_count:
          type: integer
        comment_count:
          type: integer
        is_liked_by_current_user:
          type: boolean
        author:
          type: object
          properties:
            username:
              type: string
            uuid:
              type: string
            name:
              type: string
            avatar:
              $ref: '#/components/schemas/MediaItem'
          required:
            - uuid
            - username
            - name
        fandoms:
          type: array
          items:
            $ref: '#/components/schemas/Fandom'
        created_at:
          type: long
          description: epoch seconds
        media_items:
          type: array
          items:
            $ref: '#/components/schemas/MediaItem'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
      required:
        - id
        - content
        - created_at
        - author
        - like_count
        - comment_count
        - is_liked_by_current_user

    CreatePostResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/Post'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    PostListData:
      type: object
      properties:
        posts:
          type: array
          items:
            $ref: '#/components/schemas/Post'
      required:
        - posts

    PostListResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/PostListData'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status


    CommentsGetRequest:
      type: object
      properties:
        cursor_timestamp:
          type: integer
          format: int64
          description: time in epoch seconds as a cursor (last received post)
        size:
          type: integer
      required:
        - size

    CommentListData:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
      required:
        - comments

    Comment:
      type: object
      properties:
        id:
          type: string
        author_name:
          type: string
        author_username:
          type: string
        author_avatar:
          $ref: '#/components/schemas/MediaItem'
        content:
          type: string
        created_at:
          type: long
      required:
        - id
        - author_username
        - content
        - created_at

    CommentListResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/CommentListData'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    PostLikeSuccess:
      type: object
      properties:
        status:
          type: string
          enum: [ LIKED, LIKE_REMOVED ]

    PostLikeResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/PostLikeSuccess'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    GetFeedRequest:
      type: object
      properties:
        uuid:
          type: string
        pagination:
          $ref: '#/components/schemas/TimestampPaginationRequest'
      required:
        - uuid
        - pagination


    # -------------------------
    # FANDOMS
    # -------------------------

    FandomsGetRequest:
      type: object
      properties:
        uuid:
          type: string
      required:
        - uuid

    FandomListData:
      type: object
      properties:
        fandoms:
          type: array
          items:
            $ref: '#/components/schemas/Fandom'
      required:
        - fandoms

    FandomListResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/FandomListData'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    Fandom:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        category:
          $ref: '#/components/schemas/FandomCategory'
      required:
        - id
        - name
        - category

    FandomCategory:
      type: string
      enum:
        - ANIME_MANGA
        - BOOKS
        - CARTOONS
        - FILMS
        - TV_SERIES
        - GAMES
        - TABLETOP_GAMES
        - MUSIC
        - THEATER_MUSICALS
        - PODCASTS
        - COMICS
        - CELEBRITIES
        - SPORTS
        - HISTORY
        - MYTHOLOGY
        - OTHER

    FandomCategoryListData:
      type: object
      properties:
        categories:
          type: array
          items:
            $ref: '#/components/schemas/FandomCategory'
      required:
        - categories

    FandomCategoryListResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/FandomCategoryListData'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    FandomRequestCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        category:
          $ref: '#/components/schemas/FandomCategory'
        author_uuid:
          type: string
      required:
        - name
        - author_uuid
        - category

    FandomRequestCreateResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    FandomInput:
      type: object
      properties:
        name:
          type: string
        category:
          $ref: '#/components/schemas/FandomCategory'
      required:
        - name
        - category

    FandomOneshotRequest:
      type: object
      properties:
        fandoms:
          type: array
          items:
            $ref: '#/components/schemas/FandomInput'
          default: []
        insert_from_pending:
          type: boolean
          default: false

    FandomOneshotStatus:
      type: string
      enum:
        - SUCCESS
        - CATEGORY_NOT_FOUND

    FandomOneshotData:
      type: object
      properties:
        fandoms_inserted:
          type: array
          items:
            $ref: '#/components/schemas/FandomInput'
        fandoms_not_inserted:
          type: array
          items:
            $ref: '#/components/schemas/FandomInput'
      required:
        - fandoms_inserted
        - fandoms_not_inserted

    FandomOneshotResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/FandomOneshotStatus'
        successResponse:
          $ref: '#/components/schemas/FandomOneshotData'
      required:
        - status

    # -------------------------
    # USER PREFERENCES
    # -------------------------

    UserPreferences:
      type: object
      properties:
        match_notifications_enabled:
          type: boolean
        message_notifications_enabled:
          type: boolean
        hide_my_posts_from_non_matches:
          type: boolean
      required:
        - match_notifications_enabled
        - message_notifications_enabled
        - hide_my_posts_from_non_matches

    UserPreferencesResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/UserPreferences'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    UpdateUserPreferencesRequest:
      type: object
      properties:
        match_notifications_enabled:
          type: boolean
        message_notifications_enabled:
          type: boolean
        hide_my_posts_from_non_matches:
          type: boolean
      required:
        - match_notifications_enabled
        - message_notifications_enabled
        - hide_my_posts_from_non_matches

    # -------------------------
    # CITIES
    # -------------------------

    CitySearchData:
      type: object
      properties:
        cities:
          type: array
          items:
            $ref: '#/components/schemas/City'
      required:
        - cities

    CitySearchResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/CitySearchData'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    # -------------------------
    # COMMENTS (CREATE)
    # -------------------------

    CreateCommentRequest:
      type: object
      properties:
        content:
          type: string
        timestamp:
          type: integer
          format: int64
          description: Время отправки в epoch seconds (для отображения, сервер использует server time)
      required:
        - content

    CreateCommentResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/Comment'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status