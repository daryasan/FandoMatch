openapi: 3.0.3
info:
  title: users service api
  version: 1.0.0
  description: API для сервиса users


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Сервисный API-ключ для внутренних вызовов

  parameters:
    TokenHeader:
      name: Authorization
      in: header
      required: true
      schema:
        type: string
        description: Bearer JWT token
    ApiKeyHeader:
      name: X-API-Key
      in: header
      required: false
      schema:
        type: string
      description: Сервисный API-ключ для внутренних вызовов

  schemas:
    # auth/register
    UserRegistrationRequest:
      type: object
      properties:
        email:
          type: string
        username:
          type: string
        birth_date:
          type: long
          description: birth date in epoch seconds
        name:
          type: string
        hashed_password:
          type: string
      required:
        - email
        - username
        - hashed_password
        - name
        - birth_date

    UserRegistrationResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/RefreshAndAccessTokens'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status


      # /auth/login
    UserLoginRequest:
      type: object
      properties:
        email:
          type: string
        username:
          type: string
        hashed_password:
          type: string
      required:
        - hashed_password

    UserLoginResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/RefreshAndAccessTokens'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status



    # /token/public-jwt
    PublicJwtResponse:
      type: object
      properties:
        public_key:
          type: string
      required:
        - public_key


    # /token/refresh-token
    RefreshTokenResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/RefreshAndAccessTokens'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status


    # /auth/logout
    LogoutResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status


    # /users/get-user-credentials
    GetUserCredentialsResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        successResponse:
          $ref: '#/components/schemas/UserCredentials'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    UserByIdRequest:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
          description: UUID пользователя
      required:
        - user_id


    # common models
    UserCredentials:
      type: object
      properties:
        uuid:
          type: string
        email:
          type: string
        username:
          type: string
        status:
          type: string
          enum:
            - ACTIVE
            - DISABLED
            - BANNED
        created_at:
          type: date-time
      required:
        - username
        - created_at
        - status

    ResponseStatus:
      type: string
      enum:
        - SUCCESS
        - ERROR
      required: true

    Error:
      type: object
      description: Статус и описание ошибки сервера
      properties:
        error_code:
          type: string
        error_message:
          type: string

    RefreshToken:
      type: object
      properties:
        refresh_token:
          type: string
      required:
        - refresh_token

    # /auth/change-password
    ChangePasswordRequest:
      type: object
      properties:
        old_password:
          type: string
        new_password:
          type: string
      required:
        - old_password
        - new_password

    ChangePasswordResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/ResponseStatus'
        errorResponse:
          $ref: '#/components/schemas/Error'
      required:
        - status

    RefreshAndAccessTokens:
      type: object
      properties:
        uuid:
          type: string
          format: uuid
        access_token:
          type: string
        refresh_token:
          type: string
      required:
        - uuid
        - access_token
        - refresh_token

    DeviceTokenRequest:
      type: object
      properties:
        fcm_token:
          type: string
      required:
        - fcm_token

    GetFcmTokenRequest:
      type: object
      properties:
        user_id:
          type: string
      required:
        - user_id

    FcmTokenResponse:
      type: object
      properties:
        fcm_token:
          type: string
          nullable: true


