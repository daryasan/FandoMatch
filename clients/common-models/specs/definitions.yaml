openapi: 3.0.3
info:
  title: core service api
  version: 1.3.0
  description: API для core‑модуля

paths: {}
components:
  schemas:
    # -----------------------
    # --- KAFKA MODELS ------
    # -----------------------
    UserChangedEvent:
      type: object
      properties:
        uid:
          type: string
          description: "Уникальный идентификатор пользователя"
        email:
          type: string
          format: email
          nullable: true
          description: "Email пользователя, может быть null"
        username:
          type: string
          description: "Имя пользователя"
        name:
          type: string
          nullable: true
          description: "Отображаемое имя; для CREATED передаётся при регистрации"
        birthDate:
          type: integer
          format: int64
          nullable: true
          description: "Дата рождения, Unix epoch seconds (UTC)"
        createdAt:
          type: string
          format: date-time
          description: "Время создания события в формате ISO 8601"
        status:
          $ref: '#/components/schemas/UserStatus'
        eventType:
          $ref: '#/components/schemas/EventType'
      required:
        - uid
        - username
        - createdAt
        - status
        - eventType

    EventType:
      type: string
      description: "Тип события"
      enum:
        - CREATED
        - UPDATED
        - DELETED

    UserStatus:
      type: string
      description: "Статус пользователя"
      enum:
        - ACTIVE
        - DISABLED
        - BANNED
        - DELETED

    MatchEvent:
      type: object
      properties:
        matchId:
          type: string
        userId1:
          type: string
        userId2:
          type: string
      required:
        - matchId
        - userId1
        - userId2

    LikeEvent:
      type: object
      properties:
        likerId:
          type: string
        likedUserId:
          type: string
      required:
        - likerId
        - likedUserId

